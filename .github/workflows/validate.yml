name: Validate Skill

on:
  push:
  pull_request:

jobs:
  node-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate

  browser-and-package:
    runs-on: ubuntu-latest
    needs: node-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - shell: pwsh
        run: ./scripts/package_skill.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: piano-keyboard-skill
          path: dist/piano-keyboard.zip
