 fill="#667567">A</text><rect x="566" y="185" width="40" height="48" rx="8" fill="#fffdf7" stroke="#dcded2"/><text x="586" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#667567">S</text><rect x="613" y="185" width="40" height="48" rx="8" fill="#b28b48" stroke="none"/><text x="633" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">D</text><rect x="660" y="185" width="40" height="48" rx="8" fill="#b28b48" stroke="none"/><text x="680" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">F</text><rect x="707" y="185" width="40" height="48" rx="8" fill="#fffdf7" stroke="#dcded2"/><text x="727" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#667567">G</text><rect x="754" y="185" width="40" height="48" rx="8" fill="#fffdf7" stroke="#dcded2"/><text x="774" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#667567">H</text><rect x="801" y="185" width="40" height="48" rx="8" fill="#327758" stroke="none"/><text x="821" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">J</text><rect x="848" y="185" width="40" height="48" rx="8" fill="#327758" stroke="none"/><text x="868" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">K</text><rect x="895" y="185" width="40" height="48" rx="8" fill="#fffdf7" stroke="#dcded2"/><text x="915" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#667567">L</text>
