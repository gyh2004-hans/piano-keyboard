<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
<title id="title">Piano Keyboard</title><desc id="desc">A warm cream and green illustration of Q–P and A–L keyboard rows, with D F J K highlighted. Two rows, one song, adaptive keys.</desc>
<rect width="1040" height="320" rx="22" fill="#f7f6ef"/>
<rect x="1" y="1" width="1038" height="318" rx="21" fill="none" stroke="#e0e3d7"/>
<path d="M42 273H998" stroke="#dce0d3"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="44" y="55" fill="#327758" font-size="12" font-weight="700" letter-spacing="3">YOUR LITTLE PIANO ROOM</text>
<text x="42" y="123" fill="#243f35" font-size="44" font-family="Georgia, serif">Two rows.</text>
<text x="42" y="176" fill="#243f35" font-size="44" font-family="Georgia, serif">One song at a time.</text>
<text x="44" y="219" fill="#68756a" font-size="15">Follow the letters. Let the keys follow the score.</text>
<rect x="477" y="76" width="518" height="174" rx="17" fill="#ebeee3" stroke="#d9dece"/>
<text x="502" y="102" fill="#5c7160" font-size="10" font-weight="700" letter-spacing="2">ADAPTIVE KEYS</text>
